<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
    <header>
        <h1 id="title">CareerLens</h1>
        <p id="description">CareerLens helps you understand where your career stands and where to go next. Analyze your resume, discover skill gaps, and get personalized career insights—all in one place.</p>
    </header>

    <main class="form-container">
        <form class="password-reset" id="password-reset">

            <label for="password">New Password</label>
            <input type="text" id="password" required minlength="8">

            <label for="confirm-password">Confirm New Password</label>
            <input type="text" id="confirm-password" required minlength="8">

            <button class="btn" id="btn">Submit</button>
        </form>

        <div id="link">
            <p class="link-para" id="link-para">Don't have an account ? Please <a href="./signup.html">signup</a></p>
        </div>
    </main>

    <div class="authentication-message" id="authentication-message">
        <button id="close-btn">X</button>
        <p id="message">Please wait...</p>
    </div>

    <script src="js/forgot-password.js" type="module"></script>
    

    
</body>
</html>
