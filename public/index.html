<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <h1>CareerLens</h1>
        <p>CareerLens helps you understand where your career stands and where to go next. Analyze your resume, discover skill gaps, and get personalized career insights—all in one place.</p>
    </header>

    <main class="form-container">
        <form class="signup-form" id="signup-form">
            
            <label for="user name">User Name</label>
            <input type="text" id="user-name" required>

            <label for="password">Password</label>
            <input type="text" id="password" required>

            <button class="btn" id="btn">Submit</button>
        </form>

        <div id="link">
            <p>Don't have an account ? Please <a href="./signup.html">signup</a></p>
        </div>
    </main>

    <script src="login.js"></script>
    

    
</body>
</html>
