<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <header>
        <h1 id="title">CareerLens</h1>
        <p id="description">CareerLens helps you understand where your career stands and where to go next. Analyze your resume, discover skill gaps, and get personalized career insights—all in one place.</p>
    </header>

    <main class="form-container">
        <form class="signup-form" id="signup-form">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>

            <label for="email">Email</label>
            <input type="mail" id="email">

            <label for="userName">User Name</label>
            <input type="text" id="userName" required>

            <label for="password">Password</label>
            <input type="text" id="password" required>

            <button class="btn" id="btn">Submit</button>
        </form>

        <div class="response-container">
            <p class ="response" id="response">Already a user? <a href="index.html">Login</a></p>
        </div>
        
    </main>

    <div class="authentication-message" id="authentication-message">
        <button id="close-btn">X</button>
        <p id="api-response">Please wait while registering user</p>
    </div>

    <script src="js/signup.js"></script>
    

    
</body>
</html>
