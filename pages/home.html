<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>
    <p id="user">Welcome, <span><b>Guest!</b></span></p>
    <div class="container">
        <form id="form">
            <label id="attach-label" for="file">Attach resume:</label>
            <input type="file" id="file" accept=".pdf" required>
            <p class="format">(Accepted Format *.pdf , *.docx, *.txt)</p>

            <label class="text-label" for="text-box">Paste job description in the box below</label>
            <div class="text">
                <textarea  id="text-box" required></textarea>
            </div>

            <button class="analyze-btn" id="analyze-btn">Analyze</button>
        </form>

        <div class="response" id="response"></div>
    </div>

    <div class="message-box" id="message-box">
        <p id="message">Please wait...</p>
    </div>

    <script src="/js/home.js" type="module"></script>
</body>
</html>
