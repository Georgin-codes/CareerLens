<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signup.css">
</head>
<body>
    <header>
        <h1>CareerLens</h1>
        <p>CareerLens helps you understand where your career stands and where to go next. Analyze your resume, discover skill gaps, and get personalized career insights—all in one place.</p>
    </header>

    <main class="form-container">
        <form class="signup-form" id="signup-form">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>

            <label for="email">Email</label>
            <input type="mail" id="email" required>

            <label for="userName">User Name</label>
            <input type="text" id="userName" required>

            <label for="password">Password</label>
            <input type="text" id="password" required>

            <button class="btn" id="btn">Submit</button>
        </form>
    </main>

    <script src="./signup.js"></script>
    

    
</body>
</html>
